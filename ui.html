<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Barvy - zkus je změnit! */
  :root {
    --pozadi: #070b18;
    --panel: rgba(10, 18, 38, .88);
    --cyan: #3fe8ff;
    --ruzova: #ff2e88;
    --zluta: #ffe14d;
    --zelena: #39ff9c;
    --text: #dff6ff;
    --tlumena: #6e8aa6;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden; user-select: none;
    background: radial-gradient(ellipse at 30% 0%, #12224a 0%, var(--pozadi) 60%);
    color: var(--text); font-family: "Segoe UI", Consolas, sans-serif;
    display: flex; justify-content: center;
  }
  .sloupec { width: min(760px, 94vw); display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
  .mono { font-family: Consolas, monospace; letter-spacing: 2px; text-transform: uppercase; font-size: 11px; }

  /* --- Horní lišta --- */
  .lista-horni { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1d3352; padding-bottom: 8px; }
  .logo { font-weight: 800; letter-spacing: 3px; border-left: 4px solid var(--zluta); padding-left: 8px; }
  .lista-horni .mono { color: var(--tlumena); }
  .mezera { flex: 1; }
  .ikona { background: none; border: 1px solid transparent; color: var(--tlumena); font-size: 16px;
           cursor: pointer; padding: 2px 6px; border-radius: 4px; }
  .ikona:hover { border-color: #1d3352; color: var(--cyan); }
  .ikona.zapnuto { color: var(--zluta); border-bottom: 2px solid var(--zluta); }
  .ikona.vypnuto { color: var(--ruzova); }

  /* --- Panel s přenosem (chat) --- */
  .prenos { position: relative; background: var(--panel); border: 1px solid var(--cyan);
            padding: 12px 16px 12px 22px; min-height: 120px;
            clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
  .prenos::before { content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 3px; background: var(--ruzova); }
  .ty { color: var(--tlumena); font-size: 13px; font-style: italic; min-height: 18px; }
  .ty b { font-style: normal; font-weight: 600; margin-right: 8px; color: #8fa9c4; }
  .hlavicka { margin: 6px 0 4px; }
  .hlavicka b { color: var(--zluta); margin-right: 10px; }
  .odpoved { font-size: 18px; line-height: 1.45; white-space: pre-wrap; min-height: 26px;
             max-height: 30vh; overflow-y: auto; }
  .stav-odpovedi { margin-top: 6px; color: var(--ruzova); }

  /* --- Panel s postavičkou --- */
  .scena { position: relative; flex: 1; min-height: 200px; background: #050814; border: 1px solid #1d3352;
           overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .scena::after { /* řádky jako na starém monitoru */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
  .roh { position: absolute; width: 22px; height: 22px; border: 3px solid var(--zluta); }
  .roh.lh { left: 6px; top: 6px; border-right: 0; border-bottom: 0; }
  .roh.ph { right: 6px; top: 6px; border-left: 0; border-bottom: 0; }
  .roh.ld { left: 6px; bottom: 6px; border-right: 0; border-top: 0; }
  .roh.pd { right: 6px; bottom: 6px; border-left: 0; border-top: 0; }
  .stitek { position: absolute; left: 22px; top: 12px; border: 1px solid var(--zluta); color: var(--zluta);
            padding: 3px 8px; background: #0b0f1f; z-index: 2; }
  .popisek { position: absolute; bottom: 12px; color: var(--tlumena); z-index: 2; }
  .popisek.vlevo { left: 22px; } .popisek.vpravo { right: 22px; }

  .capri { width: min(320px, 70%); height: auto; filter: drop-shadow(0 0 18px rgba(255,46,136,.35)); }
  .telo { animation: vznaset 4s ease-in-out infinite; transform-origin: 50% 60%; }
  .oko { animation: mrkat 5s infinite; transform-box: fill-box; transform-origin: center; }
  .pusa { transform-box: fill-box; transform-origin: center; transform: scaleY(.3); }
  .strepy { transform-origin: 160px 150px; animation: tocit 18s linear infinite; }
  @keyframes vznaset { 50% { transform: translateY(-8px); } }
  @keyframes mrkat { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes tocit { to { transform: rotate(360deg); } }
  @keyframes mluvit { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1.2); } }
  @keyframes glitch { 0%, 92%, 100% { transform: translate(0); } 94% { transform: translate(-4px, 1px); } 96% { transform: translate(3px, -1px); } }

  /* Jak Capri vypadá v jednotlivých stavech (třída na <body>) */
  body.nacitam .capri, body.ceka .capri { opacity: .65; }
  body.posloucham .oko-svetlo { fill: var(--zelena); }
  body.posloucham .usi { transform: translateY(-4px); }
  body.premyslim .strepy { animation-duration: 2.5s; }
  body.premyslim .oko-svetlo { fill: var(--zluta); }
  body.mluvim .pusa { animation: mluvit .28s ease-in-out infinite; }
  body.mluvim .capri { animation: glitch 2.2s infinite; }
  .usi { transition: transform .3s; }

  /* --- Poslech a psaní --- */
  .poslech { display: flex; align-items: center; gap: 10px; min-height: 20px; }
  .poslech .mono { color: var(--cyan); white-space: nowrap; }
  #slyseno { color: var(--zluta); font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mereni { width: 90px; height: 4px; background: #13233c; flex-shrink: 0; }
  #uroven { height: 100%; width: 0; background: var(--cyan); transition: width .08s; }

  .vstup { position: relative; display: flex; align-items: center; background: var(--panel);
           border: 2px dashed var(--cyan); border-left: 4px solid var(--ruzova); padding: 4px 12px; }
  .vstup span { color: var(--ruzova); margin-right: 10px; }
  input { flex: 1; background: none; border: none; outline: none; color: var(--text);
          font-size: 15px; padding: 10px 0; font-family: inherit; }
  input::placeholder { color: var(--tlumena); }
  .pata { display: flex; justify-content: space-between; color: var(--tlumena); }
</style>
</head>
<body class="nacitam">
<div class="sloupec">

  <!-- Horní lišta -->
  <div class="lista-horni">
    <span class="logo">CAPRI</span>
    <span class="mono">personal link</span>
    <span class="mezera"></span>
    <span class="mono" id="cena"></span>
    <button class="ikona zapnuto" id="mic" title="Microphone" onclick="prepniMikrofon()">🎙</button>
    <button class="ikona" title="New conversation" onclick="window.pywebview.api.reset()">⟲</button>
  </div>

  <!-- Přenos: co jsi řekl a co odpovídá Capri -->
  <div class="prenos">
    <div class="ty"><b>YOU</b><span id="ty"></span></div>
    <div class="hlavicka mono"><b>CAPRI /</b>incoming transmission</div>
    <div class="odpoved" id="odpoved"></div>
    <div class="stav-odpovedi mono" id="stavOdpovedi"></div>
  </div>

  <!-- Scéna s postavičkou -->
  <div class="scena">
    <div class="roh lh"></div><div class="roh ph"></div><div class="roh ld"></div><div class="roh pd"></div>
    <div class="stitek mono" id="stitek">CAPRI // BOOTING</div>

    <!-- sem Python vloží postavičku ze souboru postava.svg -->
    <!--POSTAVA-->

    <div class="popisek vlevo mono" id="popisekStav">booting systems...</div>
    <div class="popisek vpravo mono">net // secure</div>
  </div>

  <!-- Co Capri zrovna slyší -->
  <div class="poslech">
    <span class="mono">EN // listening</span>
    <div class="mereni"><div id="uroven"></div></div>
    <span id="slyseno"></span>
  </div>

  <!-- Psaní -->
  <div class="vstup">
    <span>⚡</span>
    <input id="vstup" placeholder="Talk to Capri…">
  </div>
  <div class="pata mono"><span id="pata">Capri is connecting…</span><span>enter ↵</span></div>
</div>

<script>
  const STITKY = { nacitam: "BOOTING", ceka: "STANDBY", posloucham: "LISTENING", premyslim: "PROCESSING", mluvim: "RECEIVING" };
  const PATA   = { nacitam: "Capri is connecting…", ceka: "Say “Capri…” or type a message",
                   posloucham: "Capri is listening…", premyslim: "Capri is thinking…", mluvim: "Capri is replying…" };
  const $ = id => document.getElementById(id);

  // Tyhle funkce volá Python, když se má v okně něco změnit
  function nastavStav(stav, text) {
    const predtim = document.body.className;
    document.body.className = stav;
    $('stitek').textContent = 'CAPRI // ' + (STITKY[stav] || stav.toUpperCase());
    $('popisekStav').textContent = text;
    $('pata').textContent = PATA[stav] || '';
    if (predtim === 'mluvim' && stav !== 'mluvim') $('stavOdpovedi').textContent = 'stopped';
  }
  function ukazTy(text) { $('ty').textContent = text || ''; $('slyseno').textContent = text || ''; }
  function zacniOdpoved() { $('odpoved').textContent = ''; $('stavOdpovedi').textContent = 'replying…'; }
  function pridejOdpoved(kousek) { const o = $('odpoved'); o.textContent += kousek; o.scrollTop = o.scrollHeight; }
  function ukazCenu(text) { $('cena').textContent = text; }
  function ukazHlasitost(x) { $('uroven').style.width = Math.min(100, Math.sqrt(x) * 250) + '%'; }

  // Tlačítka a psaní posílají věci do Pythonu přes window.pywebview.api
  async function prepniMikrofon() {
    const zapnuto = await window.pywebview.api.prepni_mikrofon();
    const b = $('mic');
    b.textContent = zapnuto ? '🎙' : '🔇';
    b.className = 'ikona ' + (zapnuto ? 'zapnuto' : 'vypnuto');
  }
  $('vstup').addEventListener('keydown', e => {
    const text = e.target.value.trim();
    if (e.key === 'Enter' && text) { window.pywebview.api.posli_text(text); e.target.value = ''; }
  });
</script>
</body>
</html>
